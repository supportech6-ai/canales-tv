<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Canales Abiertos TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; color: #fff;
    font-family: "Segoe UI", Roboto, Arial, sans-serif; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; }

  /* Panel lateral de canales */
  #panel { position: absolute; top: 0; left: 0; width: 620px; height: 100%;
    background: linear-gradient(90deg, rgba(10,12,20,.97) 80%, rgba(10,12,20,.0));
    padding: 40px 30px 30px 40px; transition: transform .25s ease; display: flex; flex-direction: column; }
  #panel.oculto { transform: translateX(-660px); }
  #titulo { font-size: 40px; font-weight: 700; margin-bottom: 6px; }
  #titulo span { color: #3fa9ff; }
  #grupo { font-size: 24px; color: #9ab; margin-bottom: 18px; height: 34px; }
  #grupo b { color: #fff; }
  #lista { list-style: none; flex: 1; overflow: hidden; position: relative; }
  #lista li { display: flex; align-items: center; gap: 18px; height: 78px; padding: 0 18px;
    border-radius: 12px; font-size: 28px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #lista li .num { width: 60px; color: #789; font-size: 24px; text-align: right; flex: none; }
  #lista li img { width: 64px; height: 48px; object-fit: contain; flex: none; background: rgba(255,255,255,.06); border-radius: 6px; }
  #lista li .nombre { overflow: hidden; text-overflow: ellipsis; }
  #lista li.sel { background: #1e6fd9; }
  #lista li.activo .nombre::after { content: "  ●"; color: #4f4; }
  #ayuda { font-size: 20px; color: #789; margin-top: 14px; line-height: 1.5; }

  /* Banner del canal actual */
  #banner { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%);
    background: rgba(10,12,20,.88); padding: 22px 40px; border-radius: 16px; font-size: 34px;
    display: flex; gap: 24px; align-items: center; opacity: 0; transition: opacity .3s; pointer-events: none; }
  #banner.ver { opacity: 1; }
  #banner .num { color: #3fa9ff; font-weight: 700; }
  #estado { position: absolute; top: 40px; right: 50px; font-size: 26px; background: rgba(0,0,0,.7);
    padding: 12px 24px; border-radius: 10px; display: none; }

  /* Barra de botones en pantalla (para el puntero del navegador) */
  #barra { position: absolute; right: 50px; bottom: 50px; display: flex; gap: 20px;
    transition: opacity .3s; }
  #barra.oculta { opacity: 0; pointer-events: none; }
  .btn { min-width: 200px; height: 130px; font-size: 34px; font-weight: 700; color: #fff;
    background: rgba(20,30,50,.92); border: 4px solid #3fa9ff; border-radius: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0 30px; }
  .btn:hover, .btn:focus { background: #1e6fd9; outline: none; transform: scale(1.06); }
  #pagBtns { display: flex; gap: 16px; margin-top: 14px; }
  #pagBtns .btn { min-width: 0; flex: 1; height: 90px; font-size: 30px; }
  #lista li { cursor: pointer; }
  #lista li:hover { background: rgba(63,169,255,.35); }
  #zonaToque { position: absolute; inset: 0; }

  /* Ajustes */
  #ajustes { position: absolute; inset: 0; background: rgba(0,0,0,.92); display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 28px; }
  #ajustes.ver { display: flex; }
  #ajustes h2 { font-size: 44px; }
  #ajustes p { font-size: 24px; color: #9ab; max-width: 1300px; text-align: center; }
  #ajustes input { width: 1300px; font-size: 28px; padding: 18px 22px; border-radius: 10px; border: 3px solid #345;
    background: #111; color: #fff; }
  #ajustes .botones { display: flex; gap: 24px; }
  #ajustes button { font-size: 28px; padding: 16px 40px; border-radius: 10px; border: 3px solid #345; background: #1a2230; color: #fff; }
  #ajustes .foco { border-color: #3fa9ff !important; background: #1e6fd9; }
</style>
</head>
<body>
<video id="video" autoplay playsinline></video>
<div id="zonaToque"></div>

<div id="panel">
  <div id="titulo">Canales <span>Abiertos</span></div>
  <div id="grupo"></div>
  <ul id="lista"></ul>
  <div id="pagBtns">
    <button class="btn" id="bGrupoAnt" tabindex="0">◀ Cat.</button>
    <button class="btn" id="bArriba" tabindex="0">▲</button>
    <button class="btn" id="bAbajo" tabindex="0">▼</button>
    <button class="btn" id="bGrupoSig" tabindex="0">Cat. ▶</button>
  </div>
  <div id="ayuda">Usa el puntero: haz clic en un canal para verlo.</div>
</div>

<div id="barra">
  <button class="btn" id="bAnt" tabindex="0">◀ CH −</button>
  <button class="btn" id="bLista" tabindex="0">☰ Canales</button>
  <button class="btn" id="bSig" tabindex="0">CH + ▶</button>
  <button class="btn" id="bBuscar" tabindex="0" style="min-width:130px">🔍</button>
  <button class="btn" id="bInfo" tabindex="0" style="min-width:130px">ℹ</button>
  <button class="btn" id="bAjustes" tabindex="0" style="min-width:130px">⚙</button>
</div>

<div id="banner"><span class="num"></span><span class="nom"></span></div>
<div id="estado"></div>

<div id="buscador" style="position:absolute;top:40px;left:50%;transform:translateX(-50%);display:none;gap:16px;background:rgba(10,12,20,.95);padding:24px;border-radius:16px">
  <input id="qInput" type="text" placeholder="Buscar canal… (ej. estrellas, cine)" style="width:900px;font-size:34px;padding:16px 20px;border-radius:10px;border:3px solid #3fa9ff;background:#111;color:#fff">
  <button class="btn" id="bLimpiar" style="height:80px;min-width:0">Borrar</button>
  <button class="btn" id="bCerrarBus" style="height:80px;min-width:0">Listo</button>
</div>

<div id="ajustes">
  <h2>Ajustes de lista</h2>
  <p>URLs de listas M3U separadas por espacio. Se combinan y se quitan repetidos. Usa solo transmisiones que tengas derecho a ver.</p>
  <input id="urlInput" type="text" spellcheck="false">
  <div class="botones">
    <button id="btnGuardar">Guardar y cargar</button>
    <button id="btnDefecto">Listas en español</button>
    <button id="btnMundial">Todo el mundo</button>
    <button id="btnReiniciar">Volver a revisar todos</button>
    <button id="btnCerrar">Cerrar</button>
  </div>
</div>

<script>
(function () {
  // ====== CONFIGURACIÓN ======
  // Listas por defecto (proyecto público iptv-org). Se combinan y se quitan repetidos.
  // En Ajustes puedes poner tus propias listas separadas por espacio o coma.
  // 1) Español: México, Latinoamérica y España + categorías de entretenimiento + Free-TV
  var LISTA_DEFECTO = [
    "https://iptv-org.github.io/iptv/countries/mx.m3u",
    "https://iptv-org.github.io/iptv/countries/ar.m3u",
    "https://iptv-org.github.io/iptv/countries/co.m3u",
    "https://iptv-org.github.io/iptv/countries/cl.m3u",
    "https://iptv-org.github.io/iptv/countries/pe.m3u",
    "https://iptv-org.github.io/iptv/countries/ve.m3u",
    "https://iptv-org.github.io/iptv/countries/ec.m3u",
    "https://iptv-org.github.io/iptv/countries/uy.m3u",
    "https://iptv-org.github.io/iptv/countries/py.m3u",
    "https://iptv-org.github.io/iptv/countries/bo.m3u",
    "https://iptv-org.github.io/iptv/countries/cr.m3u",
    "https://iptv-org.github.io/iptv/countries/gt.m3u",
    "https://iptv-org.github.io/iptv/countries/hn.m3u",
    "https://iptv-org.github.io/iptv/countries/sv.m3u",
    "https://iptv-org.github.io/iptv/countries/ni.m3u",
    "https://iptv-org.github.io/iptv/countries/pa.m3u",
    "https://iptv-org.github.io/iptv/countries/do.m3u",
    "https://iptv-org.github.io/iptv/countries/pr.m3u",
    "https://iptv-org.github.io/iptv/countries/cu.m3u",
    "https://iptv-org.github.io/iptv/countries/es.m3u",
    "https://iptv-org.github.io/iptv/languages/spa.m3u",
    "https://iptv-org.github.io/iptv/categories/movies.m3u",
    "https://iptv-org.github.io/iptv/categories/series.m3u",
    "https://iptv-org.github.io/iptv/categories/kids.m3u",
    "https://iptv-org.github.io/iptv/categories/animation.m3u",
    "https://iptv-org.github.io/iptv/categories/sports.m3u",
    "https://iptv-org.github.io/iptv/categories/music.m3u",
    "https://iptv-org.github.io/iptv/categories/documentary.m3u",
    "https://iptv-org.github.io/iptv/categories/comedy.m3u",
    "https://iptv-org.github.io/iptv/categories/classic.m3u",
    "https://iptv-org.github.io/iptv/categories/family.m3u",
    "https://iptv-org.github.io/iptv/categories/entertainment.m3u",
    "https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8"
  ].join(" ");
  // 2) Todo el mundo (miles de canales; tarda más en cargar y revisar)
  var LISTA_MUNDIAL = [
    "https://iptv-org.github.io/iptv/index.m3u",
    "https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8"
  ].join(" ");
  var FILAS_VISIBLES = 11;
  var HORAS_CACHE = 12;          // cuánto tiempo recordar qué canales están caídos

  // Nombres de categoría en español
  var TRADUCCION = { "General": "General", "News": "Noticias", "Movies": "Películas", "Series": "Series",
    "Entertainment": "Entretenimiento", "Kids": "Infantil", "Animation": "Animación", "Sports": "Deportes",
    "Music": "Música", "Comedy": "Comedia", "Documentary": "Documentales", "Religious": "Religión",
    "Education": "Educación", "Culture": "Cultura", "Lifestyle": "Estilo de vida", "Cooking": "Cocina",
    "Family": "Familia", "Classic": "Clásicos", "Local": "Locales", "Legislative": "Gobierno",
    "Business": "Negocios", "Science": "Ciencia", "Travel": "Viajes", "Shop": "Compras",
    "Weather": "Clima", "Outdoor": "Aire libre", "Auto": "Autos", "Relax": "Relajación",
    "Undefined": "Otros", "Other": "Otros" };

  // ====== Estado ======
  var canales = [], grupos = ["Todos"], grupoIdx = 0, filtrados = [];
  var sel = 0, activo = -1, hls = null, timerPanel = null, timerBanner = null, numBuffer = "", timerNum = null;
  var video = document.getElementById("video");
  var panel = document.getElementById("panel");
  var lista = document.getElementById("lista");
  var grupoEl = document.getElementById("grupo");
  var banner = document.getElementById("banner");
  var estado = document.getElementById("estado");
  var ajustes = document.getElementById("ajustes");
  var urlInput = document.getElementById("urlInput");
  var focoAjustes = 0;
  var elemsAjustes = [urlInput, document.getElementById("btnGuardar"), document.getElementById("btnDefecto"), document.getElementById("btnMundial"), document.getElementById("btnReiniciar"), document.getElementById("btnCerrar")];

  function leer(k, d) { try { var v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
  function guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  function mostrarEstado(t, ms) {
    estado.textContent = t; estado.style.display = "block";
    clearTimeout(mostrarEstado._t);
    if (ms) mostrarEstado._t = setTimeout(function () { estado.style.display = "none"; }, ms);
  }

  // ====== Parser M3U ======
  function parsearM3U(texto, origen) {
    var lineas = texto.split(/\r?\n/), res = [], info = null;
    for (var i = 0; i < lineas.length; i++) {
      var l = lineas[i].trim();
      if (!l) continue;
      if (l.indexOf("#EXTINF") === 0) {
        var attr = function (n) { var m = l.match(new RegExp(n + '="([^"]*)"')); return m ? m[1] : ""; };
        var coma = l.lastIndexOf(",");
        var g = (attr("group-title") || "Otros").split(";")[0];
        info = { nombre: coma >= 0 ? l.slice(coma + 1).trim() : "Canal", logo: attr("tvg-logo"),
                 grupo: TRADUCCION[g] || g, mx: /countries\/mx/.test(origen) || /m[eé]xico/i.test(g) };
      } else if (l[0] !== "#" && info) {
        info.url = l; res.push(info); info = null;
      }
    }
    return res;
  }

  // Descarga varias listas y las combina sin repetidos (México primero)
  function cargarLista(urls) {
    var lista_ = String(urls).split(/[\s,]+/).filter(function (u) { return u; });
    var pendientes = lista_.length, resultados = [];
    if (!pendientes) { mostrarEstado("No hay listas configuradas"); return; }
    mostrarEstado("Cargando canales…");
    lista_.forEach(function (u, n) {
      var xhr = new XMLHttpRequest();
      xhr.open("GET", u, true);
      var hecho = false;
      function fin() { if (hecho) return; hecho = true; listo(); }
      xhr.onload = function () { if (xhr.status >= 200 && xhr.status < 300) resultados[n] = parsearM3U(xhr.responseText, u); fin(); };
      xhr.onerror = fin;
      setTimeout(function () { if (!hecho) { try { xhr.abort(); } catch (e) {} fin(); } }, 25000); // una lista lenta no detiene a las demás
      xhr.send();
    });
    function listo() {
      if (--pendientes > 0) return;
      var vistos = {}, caidos = leerCaidos(), todos = [];
      resultados.forEach(function (r) {
        (r || []).forEach(function (c) {
          if (vistos[c.url]) { if (c.mx) vistos[c.url].mx = true; return; }
          vistos[c.url] = c;
          if (!caidos[c.url]) todos.push(c);
        });
      });
      if (!todos.length) { mostrarEstado("No se pudo descargar ninguna lista. Revisa tu conexión."); return; }
      canales = todos;
      grupoIdx = 0; rehacerGrupos();
      mostrarEstado(canales.length + " canales cargados", 2500);
      var ultimo = parseInt(leer("ultimoCanal", "0"), 10) || 0;
      if (filtrados.length) { sel = Math.min(ultimo, filtrados.length - 1); reproducir(sel); }
      mostrarPanel();
      // Revisa en segundo plano, sin interrumpir lo que estás viendo
      setTimeout(verificarEnFondo, 5000);
    }
  }

  // ====== Verificación en segundo plano ======
  // Prueba cada canal (solo descarga su índice, muy poco dato) y quita los que no responden.
  // Recuerda los caídos unas horas para que la próxima vez abra más rápido.
  function leerCaidos() {
    try {
      var d = JSON.parse(leer("caidos", "{}"));
      if (!d.t || Date.now() - d.t > HORAS_CACHE * 3600000) return {};
      return d.u || {};
    } catch (e) { return {}; }
  }
  function guardarCaidos(mapa) { guardar("caidos", JSON.stringify({ t: Date.now(), u: mapa })); }

  function probarCanal(c, listo) {
    var terminado = false, xhr = new XMLHttpRequest();
    function fin(ok) { if (terminado) return; terminado = true; clearTimeout(t); try { xhr.abort(); } catch (e) {} listo(ok); }
    var t = setTimeout(function () { fin(false); }, 10000);
    var esLista = /\.m3u8(\?|$)/i.test(c.url);
    try {
      xhr.open("GET", c.url, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState < 2) return;
        if (!(xhr.status >= 200 && xhr.status < 400)) { fin(false); return; }
        if (!esLista) { fin(true); return; }
        if (xhr.readyState === 4) fin((xhr.responseText || "").indexOf("#EXTM3U") >= 0);
      };
      xhr.onerror = function () { fin(false); };
      xhr.send();
    } catch (e) { fin(false); }
  }

  var verificando = false;
  function verificarEnFondo() {
    if (verificando) return;
    verificando = true;
    var cola = canales.slice(), caidos = leerCaidos(), quitados = 0, activos = 0;
    function siguiente() {
      if (!cola.length) {
        if (activos === 0) {
          verificando = false;
          guardarCaidos(caidos);
          if (quitados) mostrarEstado("Se quitaron " + quitados + " canales que no funcionan", 4000);
        }
        return;
      }
      var c = cola.shift();
      if (c === canalActual) { siguiente(); return; }   // el que estás viendo no se toca
      activos++;
      probarCanal(c, function (ok) {
        activos--;
        if (!ok) {
          caidos[c.url] = 1; quitados++;
          var i = canales.indexOf(c);
          if (i >= 0) {
            canales.splice(i, 1);
            if (activo > i) activo--;
            var j = filtrados.indexOf(c);
            if (j >= 0) { filtrados.splice(j, 1); if (sel >= j && sel > 0) sel--; }
            if (!panel.classList.contains("oculto")) pintarLista();
          }
        }
        setTimeout(siguiente, 150);  // poco a poco, para no robar internet al video
      });
    }
    for (var k = 0; k < 3; k++) siguiente();
  }

  function rehacerGrupos() {
    var g = {}; canales.forEach(function (c) { g[c.grupo] = 1; });
    var hayMx = canales.some(function (c) { return c.mx; });
    grupos = ["Todos"].concat(hayMx ? ["México"] : [], g["Películas"] ? ["Películas"] : [],
      Object.keys(g).filter(function (x) { return x !== "Películas"; }).sort());
    if (grupoIdx >= grupos.length) grupoIdx = 0;
    aplicarFiltro();
  }

  var busqueda = "";
  function sinAcentos(s) { return String(s).toLowerCase().replace(/[áàä]/g, "a").replace(/[éèë]/g, "e").replace(/[íìï]/g, "i").replace(/[óòö]/g, "o").replace(/[úùü]/g, "u"); }
  function aplicarFiltro() {
    var g = grupos[grupoIdx], q = sinAcentos(busqueda.trim());
    filtrados = canales.filter(function (c) {
      if (g === "México" && !c.mx) return false;
      if (g !== "Todos" && g !== "México" && c.grupo !== g) return false;
      if (q && sinAcentos(c.nombre).indexOf(q) < 0) return false;
      return true;
    });
    sel = 0; pintarLista();
  }

  // ====== Render ======
  function pintarLista() {
    grupoEl.innerHTML = "◀ <b>" + grupos[grupoIdx] + "</b> ▶ &nbsp;(" + filtrados.length + ")" + (busqueda ? " · 🔍 \"" + esc(busqueda) + "\"" : "");
    var inicio = Math.max(0, Math.min(sel - Math.floor(FILAS_VISIBLES / 2), filtrados.length - FILAS_VISIBLES));
    var html = "";
    for (var i = inicio; i < Math.min(filtrados.length, inicio + FILAS_VISIBLES); i++) {
      var c = filtrados[i];
      var cls = (i === sel ? "sel " : "") + (c === canales[activo] ? "activo" : "");
      html += '<li tabindex="0" data-i="' + i + '" class="' + cls + '"><span class="num">' + (canales.indexOf(c) + 1) + '</span>' +
        (c.logo ? '<img src="' + esc(c.logo) + '" onerror="this.style.visibility=\'hidden\'">' : '<img style="visibility:hidden">') +
        '<span class="nombre">' + esc(c.nombre) + '</span></li>';
    }
    lista.innerHTML = html || '<li>Sin canales</li>';
  }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (m) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]; }); }

  function mostrarPanel() {
    panel.classList.remove("oculto");
    clearTimeout(timerPanel);
    timerPanel = setTimeout(ocultarPanel, 8000);
  }
  function ocultarPanel() { panel.classList.add("oculto"); }

  function mostrarBanner(c) {
    banner.querySelector(".num").textContent = canales.indexOf(c) + 1;
    banner.querySelector(".nom").textContent = c.nombre;
    banner.classList.add("ver");
    clearTimeout(timerBanner);
    timerBanner = setTimeout(function () { banner.classList.remove("ver"); }, 3500);
  }

  // ====== Reproducción ======
  // ====== Reproducción con colchón (búfer) ======
  // Idea: en lugar de reproducir "al ritmo en que llega", la app junta varios segundos
  // por adelantado y vigila que ese colchón no se acabe.
  var COLCHON_INICIAL = 15;  // segundos a juntar antes de empezar
  var COLCHON_MINIMO  = 4;   // si baja de aquí, pausa una vez y rellena
  var COLCHON_RELLENO = 20;  // hasta cuánto rellenar tras una pausa
  var COLCHON_LENTO   = 10;  // por debajo de esto reproduce 3% más lento (imperceptible) para recuperar

  var CONFIG_HLS = {
    enableWorker: true,
    lowLatencyMode: false,
    startFragPrefetch: true,
    maxBufferLength: 60,
    maxMaxBufferLength: 120,
    maxBufferSize: 60 * 1000 * 1000,
    backBufferLength: 10,            // libera lo ya visto para no llenar la memoria de la TV
    maxBufferHole: 0.5,
    nudgeMaxRetry: 10,
    liveSyncDuration: 30,            // reproduce 30 s atrás del "en vivo" = más colchón
    liveMaxLatencyDuration: 600,     // nunca brinca hacia adelante (eso se comía el colchón)
    maxLiveSyncPlaybackRate: 1,
    capLevelToPlayerSize: true,
    abrEwmaDefaultEstimate: 1500000,
    abrBandWidthFactor: 0.75,
    abrBandWidthUpFactor: 0.5,
    manifestLoadingMaxRetry: 6,
    levelLoadingMaxRetry: 8,
    fragLoadingMaxRetry: 8,
    fragLoadingRetryDelay: 1000
  };

  var canalActual = null, reintentosRed = 0, ultimoTiempo = 0, segundosAtorado = 0;
  var rellenando = false, esperaInicio = 0, pausasRecientes = [], verInfo = false;

  function reproducir(i) {
    var c = filtrados[i]; if (!c) return;
    activo = canales.indexOf(c);
    guardar("ultimoCanal", String(i));
    canalActual = c; reintentosRed = 0; pausasRecientes = [];
    iniciarStream(c);
    mostrarBanner(c); pintarLista();
  }

  function iniciarStream(c) {
    if (hls) { hls.destroy(); hls = null; }
    video.playbackRate = 1;
    ultimoTiempo = 0; segundosAtorado = 0;
    rellenando = true; esperaInicio = Date.now();   // empieza juntando colchón
    mostrarEstado("Conectando a " + c.nombre + "…");
    var esHls = /\.m3u8(\?|$)/i.test(c.url);
    if (esHls && window.Hls && Hls.isSupported()) {
      hls = new Hls(CONFIG_HLS);
      hls.loadSource(c.url);
      hls.attachMedia(video);
      hls.on(Hls.Events.FRAG_LOADED, function () { reintentosRed = 0; });
      hls.on(Hls.Events.ERROR, function (e, d) {
        if (!d.fatal) return;
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR && reintentosRed < 15) {
          reintentosRed++;
          mostrarEstado("Reconectando… (" + reintentosRed + ")");
          setTimeout(function () { if (hls) hls.startLoad(); }, Math.min(1000 * reintentosRed, 5000));
        } else if (d.type === Hls.ErrorTypes.MEDIA_ERROR) {
          hls.recoverMediaError();
        } else {
          mostrarEstado("Reiniciando canal…");
          setTimeout(function () { if (canalActual) iniciarStream(canalActual); }, 2000);
        }
      });
    } else {
      video.src = c.url; // HLS nativo del navegador o MP4
      video.preload = "auto";
    }
    video.pause();
  }

  function intentarPlay() {
    var p = video.play();
    if (p && p.catch) p.catch(function () {});
  }

  // Segundos ya descargados por delante de lo que se está viendo
  function colchon() {
    var b = video.buffered, t = video.currentTime;
    for (var i = 0; i < b.length; i++) {
      if (t >= b.start(i) - 0.5 && t <= b.end(i) + 0.5) return Math.max(0, b.end(i) - t);
    }
    return 0;
  }

  // Si hubo 2 pausas en 5 minutos, baja un nivel de calidad
  function registrarPausa() {
    var ahora = Date.now();
    pausasRecientes.push(ahora);
    pausasRecientes = pausasRecientes.filter(function (x) { return ahora - x < 300000; });
    if (pausasRecientes.length >= 2 && hls && hls.levels && hls.levels.length > 1) {
      var actual = hls.currentLevel >= 0 ? hls.currentLevel : hls.levels.length - 1;
      var tope = hls.autoLevelCapping < 0 ? actual : hls.autoLevelCapping;
      if (tope > 0) {
        hls.autoLevelCapping = tope - 1;
        mostrarEstado("Bajando calidad para evitar pausas", 3000);
        pausasRecientes = [];
      }
    }
  }

  // Al llegar al punto donde empieza el búfer (p. ej. tras cambiar de canal)
  function alinearInicio() {
    var b = video.buffered;
    if (b.length && (video.currentTime < b.start(0) || video.currentTime > b.end(b.length - 1))) {
      video.currentTime = b.start(0) + 0.1;
    }
  }

  // ====== Controlador del colchón (cada medio segundo) ======
  setInterval(function () {
    if (!canalActual) return;
    var c = colchon();

    if (rellenando) {
      alinearInicio();
      var meta = video.currentTime > 1 ? COLCHON_RELLENO : COLCHON_INICIAL;
      var esperado = (Date.now() - esperaInicio) / 1000;
      // Arranca al tener el colchón, o tras 25 s de espera con lo que haya (mínimo 3 s)
      if (c >= meta || (esperado > 25 && c >= 3)) {
        rellenando = false; video.playbackRate = 1;
        estado.style.display = "none";
        intentarPlay();
      } else if (!verInfo) {
        mostrarEstado("Cargando… " + Math.floor(Math.min(100, c / meta * 100)) + "%");
      }
    } else {
      if (c < COLCHON_MINIMO && !video.ended) {
        // Una pausa más larga pero única, en lugar de muchos cortes pequeños
        rellenando = true; esperaInicio = Date.now();
        video.pause(); registrarPausa();
      } else if (c < COLCHON_LENTO) {
        video.playbackRate = 0.97;
      } else if (c > COLCHON_LENTO + 5) {
        video.playbackRate = 1;
      }
    }

    if (verInfo) {
      var nivel = hls && hls.levels && hls.levels[hls.currentLevel];
      mostrarEstado("Colchón: " + c.toFixed(1) + " s · " + (nivel ? nivel.height + "p" : "auto") +
        " · velocidad " + video.playbackRate + (rellenando ? " · rellenando" : ""));
    }
  }, 500);

  // ====== Vigilante: si el video se congela con colchón disponible ======
  setInterval(function () {
    if (!canalActual || rellenando || video.paused) { segundosAtorado = 0; return; }
    var t = video.currentTime;
    if (Math.abs(t - ultimoTiempo) < 0.05) segundosAtorado++; else segundosAtorado = 0;
    ultimoTiempo = t;
    if (segundosAtorado === 4) {
      // Brinca el hueco en el búfer
      var b = video.buffered;
      for (var i = 0; i < b.length; i++) if (b.start(i) > t) { video.currentTime = b.start(i) + 0.1; break; }
      intentarPlay();
    } else if (segundosAtorado >= 10) {
      mostrarEstado("Reiniciando canal…");
      iniciarStream(canalActual);
    }
  }, 1000);

  video.addEventListener("error", function () {
    if (canalActual) { mostrarEstado("Error, reintentando…"); setTimeout(function () { iniciarStream(canalActual); }, 3000); }
  });

  // Al volver de segundo plano, juntar colchón de nuevo
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && canalActual) { rellenando = true; esperaInicio = Date.now(); }
  });

  function alternarInfo() { verInfo = !verInfo; if (!verInfo) estado.style.display = "none"; }

  function cambiarCanal(d) {
    if (!filtrados.length) return;
    var actualEnFiltro = filtrados.indexOf(canales[activo]);
    var n = ((actualEnFiltro < 0 ? sel : actualEnFiltro) + d + filtrados.length) % filtrados.length;
    sel = n; reproducir(n);
  }

  // Ir a canal por número (teclas 1-9)
  function teclaNumero(n) {
    numBuffer += n; mostrarEstado("Canal " + numBuffer);
    clearTimeout(timerNum);
    timerNum = setTimeout(function () {
      var idx = parseInt(numBuffer, 10) - 1; numBuffer = "";
      if (canales[idx]) { grupoIdx = 0; aplicarFiltro(); sel = idx; reproducir(idx); }
      else mostrarEstado("No existe ese canal", 2000);
    }, 1500);
  }

  // ====== Ajustes ======
  function abrirAjustes() {
    urlInput.value = leer("listaURL", LISTA_DEFECTO);
    ajustes.classList.add("ver"); focoAjustes = 1; pintarFoco();
  }
  function cerrarAjustes() { ajustes.classList.remove("ver"); urlInput.blur(); }
  function pintarFoco() {
    elemsAjustes.forEach(function (e, i) { e.classList.toggle("foco", i === focoAjustes); });
    if (focoAjustes === 0) urlInput.focus(); else urlInput.blur();
  }
  function accionAjustes() {
    if (focoAjustes === 0) { urlInput.focus(); return; }
    if (focoAjustes === 1) { guardar("listaURL", urlInput.value.trim()); cerrarAjustes(); cargarLista(urlInput.value.trim()); }
    if (focoAjustes === 2) { guardar("listaURL", LISTA_DEFECTO); cerrarAjustes(); cargarLista(LISTA_DEFECTO); }
    if (focoAjustes === 3) { guardar("listaURL", LISTA_MUNDIAL); cerrarAjustes(); cargarLista(LISTA_MUNDIAL); }
    if (focoAjustes === 4) { guardar("caidos", "{}"); cerrarAjustes(); cargarLista(leer("listaURL", LISTA_DEFECTO)); }
    if (focoAjustes === 5) cerrarAjustes();
  }
  elemsAjustes.forEach(function (e, i) { e.addEventListener("click", function () { focoAjustes = i; accionAjustes(); }); });

  // ====== Control remoto ======
  // Códigos comunes en VIDAA/Hisense y navegadores TV
  var K = { UP: 38, DOWN: 40, LEFT: 37, RIGHT: 39, OK: 13, BACK: [8, 27, 461, 10009],
            CH_UP: [33, 427], CH_DOWN: [34, 428], RED: [403, 82], ZERO: 48 };
  function es(code, lista) { return lista.indexOf(code) >= 0; }

  document.addEventListener("keydown", function (e) {
    var k = e.keyCode;

    if (ajustes.classList.contains("ver")) {
      if (focoAjustes === 0 && k !== K.UP && k !== K.DOWN && k !== K.OK && !es(k, [27, 461, 10009])) return; // escribir
      if (k === K.DOWN || k === K.RIGHT) focoAjustes = Math.min(elemsAjustes.length - 1, focoAjustes + 1);
      else if (k === K.UP || k === K.LEFT) focoAjustes = Math.max(0, focoAjustes - 1);
      else if (k === K.OK) accionAjustes();
      else if (es(k, K.BACK)) cerrarAjustes();
      pintarFoco(); e.preventDefault(); return;
    }

    var panelVisible = !panel.classList.contains("oculto");
    if (k >= 49 && k <= 57) { teclaNumero(String(k - 48)); e.preventDefault(); return; }

    if (k === K.UP) { if (!panelVisible) mostrarPanel(); else { sel = Math.max(0, sel - 1); pintarLista(); mostrarPanel(); } }
    else if (k === K.DOWN) { if (!panelVisible) mostrarPanel(); else { sel = Math.min(filtrados.length - 1, sel + 1); pintarLista(); mostrarPanel(); } }
    else if (k === K.LEFT) { grupoIdx = (grupoIdx - 1 + grupos.length) % grupos.length; aplicarFiltro(); mostrarPanel(); }
    else if (k === K.RIGHT) { grupoIdx = (grupoIdx + 1) % grupos.length; aplicarFiltro(); mostrarPanel(); }
    else if (k === K.OK) { if (panelVisible) { reproducir(sel); ocultarPanel(); } else mostrarPanel(); }
    else if (es(k, K.CH_UP)) cambiarCanal(1);
    else if (es(k, K.CH_DOWN)) cambiarCanal(-1);
    else if (es(k, K.RED) || k === K.ZERO) abrirAjustes();
    else if (k === 406 || k === 73) alternarInfo();
    else if (es(k, K.BACK)) { if (panelVisible) ocultarPanel(); else return; } // deja salir de la app
    else return;
    e.preventDefault();
  });

  // ====== Puntero / clic (navegador de la TV) ======
  var barra = document.getElementById("barra"), timerBarra = null;
  function mostrarBarra() {
    barra.classList.remove("oculta");
    clearTimeout(timerBarra);
    timerBarra = setTimeout(function () { barra.classList.add("oculta"); }, 10000);
  }
  function enClic(id, fn) {
    var el = document.getElementById(id);
    el.addEventListener("click", function (e) { e.stopPropagation(); fn(); mostrarBarra(); });
  }
  enClic("bAnt", function () { cambiarCanal(-1); });
  enClic("bSig", function () { cambiarCanal(1); });
  enClic("bLista", function () { if (panel.classList.contains("oculto")) mostrarPanel(); else ocultarPanel(); });
  enClic("bAjustes", abrirAjustes);
  enClic("bInfo", alternarInfo);
  var buscador = document.getElementById("buscador"), qInput = document.getElementById("qInput");
  enClic("bBuscar", function () { buscador.style.display = "flex"; qInput.value = busqueda; qInput.focus(); mostrarPanel(); });
  enClic("bLimpiar", function () { qInput.value = ""; busqueda = ""; aplicarFiltro(); mostrarPanel(); qInput.focus(); });
  enClic("bCerrarBus", function () { buscador.style.display = "none"; qInput.blur(); mostrarPanel(); });
  qInput.addEventListener("input", function () { busqueda = qInput.value; aplicarFiltro(); mostrarPanel(); });
  qInput.addEventListener("keydown", function (e) {
    e.stopPropagation();
    if (e.keyCode === 13) { buscador.style.display = "none"; qInput.blur(); mostrarPanel(); }
  });
  enClic("bArriba", function () { sel = Math.max(0, sel - (FILAS_VISIBLES - 1)); pintarLista(); mostrarPanel(); });
  enClic("bAbajo", function () { sel = Math.min(filtrados.length - 1, sel + (FILAS_VISIBLES - 1)); pintarLista(); mostrarPanel(); });
  enClic("bGrupoAnt", function () { grupoIdx = (grupoIdx - 1 + grupos.length) % grupos.length; aplicarFiltro(); mostrarPanel(); });
  enClic("bGrupoSig", function () { grupoIdx = (grupoIdx + 1) % grupos.length; aplicarFiltro(); mostrarPanel(); });

  // Clic en cualquier parte del video: muestra/oculta los botones
  document.getElementById("zonaToque").addEventListener("click", function () {
    if (barra.classList.contains("oculta")) mostrarBarra(); else barra.classList.add("oculta");
  });
  // Mover el puntero muestra los botones; mientras esté sobre la lista, no se oculta
  document.addEventListener("mousemove", mostrarBarra);
  panel.addEventListener("mousemove", function () { mostrarPanel(); });
  // Rueda del ratón para recorrer la lista
  panel.addEventListener("wheel", function (e) {
    sel = Math.max(0, Math.min(filtrados.length - 1, sel + (e.deltaY > 0 ? 1 : -1)));
    pintarLista(); mostrarPanel(); e.preventDefault();
  });

  // Clic en un canal de la lista
  lista.addEventListener("click", function (e) {
    var li = e.target;
    while (li && li.tagName !== "LI") li = li.parentNode;
    if (!li || li.getAttribute("data-i") === null) return;
    sel = parseInt(li.getAttribute("data-i"), 10);
    reproducir(sel); mostrarPanel();
  });

  // ====== Inicio ======
  // Si venías de una versión anterior, actualiza a las nuevas listas
  if (leer("versionListas", "") !== "3") { guardar("listaURL", LISTA_DEFECTO); guardar("versionListas", "3"); }
  cargarLista(leer("listaURL", LISTA_DEFECTO));
  mostrarBarra();
})();
</script>
</body>
